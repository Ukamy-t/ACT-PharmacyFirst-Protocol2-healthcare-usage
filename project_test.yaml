version: '4.0'
actions:
  generate_dataset:
    run: ehrql:v1 generate-dataset analysis/dataset_definition_patients.py --output
      output/dataset_patients.csv.gz
    outputs:
      highly_sensitive:
        dataset: output/dataset_patients.csv.gz
  generate_patient_dataset_2022_02_01:
    run: ehrql:v1 generate-dataset analysis/dataset_definition_patients.py --dummy-tables
      dummy_tables --output output/dataset_patients_2022-02-01.csv.gz -- --start_date
      2022-02-01
    outputs:
      highly_sensitive:
        dataset: output/dataset_patients_2022-02-01.csv.gz
  generate_patient_dataset_2022_03_01:
    run: ehrql:v1 generate-dataset analysis/dataset_definition_patients.py --dummy-tables
      dummy_tables --output output/dataset_patients_2022-03-01.csv.gz -- --start_date
      2022-03-01
    outputs:
      highly_sensitive:
        dataset: output/dataset_patients_2022-03-01.csv.gz

